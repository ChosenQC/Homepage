<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"/><meta name="referrer" content="no-referrer"/><meta name="viewport" content="width=device-width,initial-scale=1"/><meta name="theme-color" content="#f6f7f3"/>
  <title>日程 · Daybook</title><link rel="stylesheet" href="./style.css?v=20261027-repeat-1"/>
  <script>if(location.protocol === "file:") location.replace("https://chosenqc.github.io/Homepage/" + location.hash);</script>
</head>
<body>
  <svg class="icon-defs" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><defs>
    <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
    <symbol id="i-left" viewBox="0 0 24 24"><path d="m14 6-6 6 6 6"/></symbol>
    <symbol id="i-right" viewBox="0 0 24 24"><path d="m10 6 6 6-6 6"/></symbol>
    <symbol id="i-sync" viewBox="0 0 24 24"><path d="M20 7v5h-5M4 17v-5h5M6.1 7a7 7 0 0 1 11.6-1L20 9M4 15l2.3 3A7 7 0 0 0 17.9 17"/></symbol>
    <symbol id="i-link" viewBox="0 0 24 24"><path d="m10 13 4-4M8 16l-1 1a4 4 0 0 1-6-6l4-4a4 4 0 0 1 6 0M16 8l1-1a4 4 0 0 1 6 6l-4 4a4 4 0 0 1-6 0" transform="translate(2 0) scale(.85 1)"/></symbol>
    <symbol id="i-flag" viewBox="0 0 24 24"><path d="M5 21V4c5-4 9 4 14 0v11c-5 4-9-4-14 0"/></symbol>
    <symbol id="i-close" viewBox="0 0 24 24"><path d="m6 6 12 12M6 18 18 6"/></symbol>
    <symbol id="i-calendar" viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="16" rx="3"/><path d="M8 3v4M16 3v4M4 11h16m-11 5 2 2 4-4"/></symbol>
  </defs></svg>
  <main class="shell" id="appView">
    <header class="app-header">
      <div class="brand"><span class="brand-mark"><svg><use href="#i-calendar"/></svg></span><span>日程<span class="brand-en">DAYBOOK</span></span></div>
      <div class="header-actions"><button id="syncBtn" class="icon-button" aria-label="同步任务" title="同步任务"><svg><use href="#i-sync"/></svg></button><button id="copyLinkBtn" class="link-button" title="复制专属同步链接"><svg><use href="#i-link"/></svg><span>同步链接</span></button></div>
    </header>
    <section id="sharePanel" class="share-panel hidden" aria-label="跨设备同步"><label for="shareLinkInput">手机和电脑打开同一个完整链接</label><div class="share-link-row"><input id="shareLinkInput" type="text" readonly aria-label="线上同步链接"/><a id="openOnlineLink" target="_blank" rel="noopener noreferrer">打开线上版 ↗</a><button id="closeShareBtn" type="button" class="icon-button" aria-label="关闭同步链接">×</button></div></section>
    <section class="page-heading"><div><div class="eyebrow" id="monthTitle">周日程</div><h1>本周日程<span class="heading-dot"> / </span><span id="monthHeading"></span></h1></div><button id="newTaskBtn" class="primary-button"><svg><use href="#i-plus"/></svg><span>新建任务</span></button></section>
    <div class="workspace">
      <section class="agenda" aria-label="每周日程">
        <div class="agenda-toolbar"><div class="week-heading"><h2 id="weekTitle"></h2><span class="week-count" id="weekCount"></span></div><nav class="week-nav" aria-label="切换周"><button id="prevWeekBtn" class="icon-button" aria-label="上一周" title="上一周"><svg><use href="#i-left"/></svg></button><button id="todayBtn">今天</button><button id="nextWeekBtn" class="icon-button" aria-label="下一周" title="下一周"><svg><use href="#i-right"/></svg></button></nav></div>
        <div class="day-list" id="calGrid"></div>
      </section>
      <aside class="sidebar" aria-label="任务优先级"><div class="sidebar-heading"><h2><span class="section-dot"></span>优先安排</h2><span class="count-pill" id="priorityCount">0</span></div><ul id="priorityList" class="priority-list"></ul><button id="newDeadlineBtn" class="deadline-button"><svg><use href="#i-flag"/></svg>添加截止事项<svg class="button-plus"><use href="#i-plus"/></svg></button></aside>
    </div>
    <footer class="app-footer"><span class="footer-brand">DAYBOOK</span><p id="appMsg" role="status" aria-live="polite"></p></footer>
  </main>
  <div id="modalOverlay" class="modal-overlay hidden"><section class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle" tabindex="-1">
    <div class="modal-header"><h2 id="modalTitle">新建任务</h2><button id="modalCloseBtn" class="icon-button" aria-label="关闭"><svg><use href="#i-close"/></svg></button></div>
    <label class="field"><span>任务名称</span><input id="taskTitleInput" placeholder="准备做些什么？" autocomplete="off"/></label>
    <div class="quick-activities" role="group" aria-label="快捷事项">
      <div class="fitness-presets"><span class="preset-category">健身</span><div class="preset-options"><button type="button" class="preset-chip" data-task-title="健身 · 练腿" aria-pressed="false">练腿</button><button type="button" class="preset-chip" data-task-title="健身 · 练胸" aria-pressed="false">练胸</button><button type="button" class="preset-chip" data-task-title="健身 · 练背" aria-pressed="false">练背</button></div></div>
      <div class="preset-options"><button type="button" class="preset-chip" data-task-title="游泳" aria-pressed="false">游泳</button><button type="button" class="preset-chip" data-task-title="工作" aria-pressed="false">工作</button><button type="button" class="preset-chip" data-task-title="开会" aria-pressed="false">开会</button><button type="button" class="preset-chip" data-task-title="游戏" aria-pressed="false">游戏</button></div>
    </div>
    <label class="type-toggle"><input id="taskIsDeadline" type="checkbox"/><svg><use href="#i-flag"/></svg><span>截止事项</span></label>
    <div id="scheduledFields" class="modal-fields"><label class="field"><span>开始时间</span><input id="taskStartInput" type="datetime-local"/></label><label class="field"><span>时长（分钟）</span><input id="taskDurInput" type="number" min="15" step="15" value="60"/></label><div class="duration-presets" role="group" aria-label="快捷时长"><button type="button" class="preset-chip" data-duration="30" aria-pressed="false">30 分钟</button><button type="button" class="preset-chip" data-duration="60" aria-pressed="true">60 分钟</button><button type="button" class="preset-chip" data-duration="90" aria-pressed="false">90 分钟</button><button type="button" class="preset-chip" data-duration="120" aria-pressed="false">120 分钟</button></div></div>
    <div id="deadlineFields" class="hidden"><label class="field"><span>截止时间</span><input id="taskDeadlineInput" type="datetime-local"/></label></div>
    <div id="repeatFields" class="repeat-fields"><label class="field"><span>重复</span><select id="repeatFrequency"><option value="none">不重复</option><option value="daily">每天</option><option value="weekly">每周指定日期</option></select></label><div id="repeatWeekdays" class="repeat-weekdays hidden" role="group" aria-label="每周重复日期"><label><input type="checkbox" value="0" aria-label="周日"/><span>日</span></label><label><input type="checkbox" value="1" aria-label="周一"/><span>一</span></label><label><input type="checkbox" value="2" aria-label="周二"/><span>二</span></label><label><input type="checkbox" value="3" aria-label="周三"/><span>三</span></label><label><input type="checkbox" value="4" aria-label="周四"/><span>四</span></label><label><input type="checkbox" value="5" aria-label="周五"/><span>五</span></label><label><input type="checkbox" value="6" aria-label="周六"/><span>六</span></label></div><label id="repeatUntilRow" class="field hidden"><span>结束日期（选填，留空则一直重复）</span><input id="repeatUntil" type="date"/></label><p id="repeatEditNote" class="repeat-note hidden">修改将应用到整组任务；每次完成状态独立保留。</p></div>
    <p id="modalMsg" class="modal-message" role="alert"></p><div class="modal-actions"><button id="modalDeleteBtn" class="delete-button hidden">删除任务</button><button id="skipOccurrenceBtn" class="skip-button hidden">跳过本次</button><button id="modalSaveBtn" class="primary-button">保存</button></div>
  </section></div>
  <script type="module" src="./app.js?v=20261027-repeat-1"></script>
</body>
</html>
