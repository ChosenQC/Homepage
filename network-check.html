<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>连接检测 · Daybook</title><style>
*{box-sizing:border-box}body{margin:0;background:#f5f7f1;color:#365b48;font:15px/1.8 system-ui,-apple-system,sans-serif}main{max-width:650px;margin:auto;padding:50px 22px}small{font-size:10px;letter-spacing:2px;color:#93a088}h1{font-size:30px;font-weight:500;letter-spacing:-1px;margin:15px 0}p{font-size:13px;color:#8b9c80}.card{padding:20px 23px;background:white;border:1px solid #e1e8da;border-radius:15px;margin:14px 0}.card h2{font-size:15px;font-weight:500;margin:0 0 5px}.card code{color:#9ca891;font-size:10px;overflow-wrap:anywhere}.status{font-size:13px;margin-top:12px;color:#94a586}.pass{color:#427b54}.fail{color:#b27a60}button{background:#365f4d;color:white;border:0;border-radius:10px;padding:12px 21px;font:inherit;font-size:13px;cursor:pointer;margin:15px 0}button:disabled{opacity:.5}a{color:#6d895c;font-size:12px}.note{font-size:11px;margin-top:20px}</style></head><body><main>
<small>DAYBOOK / CONNECTION</small><h1>检查当前网络的同步线路</h1><p>请关闭 VPN 后检测。此页不读取或上传任务、笔记、连接码和健康数据。</p>
<article class="card"><h2>独立域名线路</h2><code>api.chenqiu.top</code><div id="custom" class="status" role="status">等待检测</div></article>
<article class="card"><h2>原有线路</h2><code>floral-flower-7c16.chen-qiu.workers.dev</code><div id="original" class="status" role="status">等待检测</div></article>
<button id="retry" type="button">重新检测</button><p id="result" role="status"></p><p class="note">新 DNS 可能仍有缓存差异。任一线路显示可连接，更新后的网页就能尝试通过它同步；两条均失败时，请把本页结果告诉我们。</p><a href="./">返回 Daybook →</a>
</main><script type="module">
const entries=[['custom','https://api.chenqiu.top'],['original','https://floral-flower-7c16.chen-qiu.workers.dev']];
async function run(){const button=document.getElementById('retry');button.disabled=true;document.getElementById('result').textContent='检测中…';const success=await Promise.all(entries.map(async([id,origin])=>{const el=document.getElementById(id),controller=new AbortController();let timer;el.className='status';el.textContent='检测中…';try{const response=await Promise.race([fetch(origin+'/api/shared/get',{method:'POST',headers:{'Content-Type':'application/json'},body:'{"key":"invalid"}',signal:controller.signal}),new Promise((_,reject)=>{timer=setTimeout(()=>{reject(Error('timeout'));controller.abort();},12000);})]);const body=await response.json();if(response.status!==400||body.error!=='Invalid calendar link')throw Error('unexpected');el.className='status pass';el.textContent='可连接 · HTTPS 与浏览器跨域请求正常';return true;}catch{el.className='status fail';el.textContent='当前网络无法连接，或 DNS 尚未刷新';return false;}finally{clearTimeout(timer);}}));document.getElementById('result').textContent=success.some(Boolean)?'至少一条同步线路可用。':'两条同步线路当前都不可用。';button.disabled=false;}
document.getElementById('retry').onclick=run;run();
</script></body></html>
