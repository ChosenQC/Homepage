plugins { id 'com.android.application' version '8.9.2' }
android {
    namespace 'com.daybook.scalebridge'
    compileSdk 35
    defaultConfig { applicationId 'com.daybook.faq'; minSdk 31; targetSdk 35; versionCode 4; versionName '0.3.1' }
    sourceSets { main { manifest.srcFile 'AndroidManifest.xml'; res.srcDirs=['build/generated/daybook-res']; java.srcDirs = ['.']; java.includes = ['MainActivity.java','ScaleService.java','ScalePacket.java','ScaleStore.java','AppUpdater.java','UpdateProvider.java','MorningWindow.java','NoonReminder.java'] } }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    buildTypes { debug { debuggable true }; release { minifyEnabled false } }
}
tasks.register('prepareDaybookResources') {
    inputs.files('faq_mark.xml','faq_launcher.xml','faq_theme.xml','faq_colors.xml')
    outputs.dir(layout.buildDirectory.dir('generated/daybook-res'))
    doLast {
        copy { from 'faq_mark.xml'; into layout.buildDirectory.dir('generated/daybook-res/drawable') }
        copy { from 'faq_launcher.xml'; into layout.buildDirectory.dir('generated/daybook-res/mipmap-anydpi-v26'); rename { 'ic_launcher.xml' } }
        copy { from 'faq_theme.xml','faq_colors.xml'; into layout.buildDirectory.dir('generated/daybook-res/values') }
    }
}
tasks.named('preBuild').configure { dependsOn 'prepareDaybookResources' }
tasks.register('verifyMorningWindow') {
    inputs.files('MorningWindow.java','MorningWindowCheck.java')
    doLast {
        def target=layout.buildDirectory.dir('morning-check').get().asFile;target.mkdirs()
        exec { commandLine "${System.getProperty('java.home')}/bin/javac",'-d',target,'MorningWindow.java','MorningWindowCheck.java' }
        exec { commandLine "${System.getProperty('java.home')}/bin/java",'-cp',target,'com.daybook.scalebridge.MorningWindowCheck' }
    }
}
tasks.named('preBuild').configure { dependsOn 'verifyMorningWindow' }
